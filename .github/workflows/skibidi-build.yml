name: Skibidi Fabric v2.4.1 Renderer Repair
on:
  push:
    branches:
      - chatgpt-skibidi-build-20260919
    paths:
      - v241-trigger.txt
      - .github/workflows/skibidi-build.yml

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct latest known-good gameplay source
        run: |
          cat chunk00.txt chunk01.txt chunk02.txt chunk03.txt | base64 -d > payload.tar.gz
          tar -xzf payload.tar.gz

          cat v2p00.txt v2p01.txt v2p02.txt v2p03.txt v2p04.txt | base64 -d > v2-patch.tar.gz
          tar -xzf v2-patch.tar.gz
          cp -a skibidi-v2-patch/. skibidi-gh-build-min/
          rm -f skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          rm -f skibidi-gh-build-min/src/main/resources/data/minecraft/tags/entity_type/zombies.json

          cp fix/SkibidiMeshLayer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          cp fix/SkibidiAttachments.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java

          base64 -d skibidi-v22-codepatch.b64 > v22-patch.tar.gz
          tar -xzf v22-patch.tar.gz
          cp -a skibidi-v2.2-codepatch/. skibidi-gh-build-min/

          cat v23f00.txt v23f01.txt v23f02.txt v23f03.txt | base64 -d > v23-final.tar.gz
          echo "b6e69e64418167b476551595c12766c8a9220faeec785b8a0ca8b34024c56c7d  v23-final.tar.gz" | sha256sum -c -
          mkdir -p v23-final
          tar -xzf v23-final.tar.gz -C v23-final
          cp -a v23-final/. skibidi-gh-build-min/

          cp v231/ModEntityTypes.java skibidi-gh-build-min/src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          cp v231/gradle.properties skibidi-gh-build-min/gradle.properties
          sed -i 's/mod_version=2.3.1/mod_version=2.4.1/' skibidi-gh-build-min/gradle.properties

      - name: Replace broken model pipeline
        run: |
          cp fix4/SkibidiMesh.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMesh.java
          cp fix4/SkibidiMeshLayer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          cp fix4/generate_v3.py skibidi-gh-build-min/generate_v3.py
          cd skibidi-gh-build-min
          python3 generate_v3.py

      - name: Model and gameplay regression checks
        working-directory: skibidi-gh-build-min
        run: |
          grep -q 'mod_version=2.4.1' gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          import struct, math
          p=Path('src/main/resources/assets/skibidi/mesh/skibidi_v3.skbm')
          raw=p.read_bytes()
          assert raw[:4] == b'SKB3'
          version,count=struct.unpack_from('<ii',raw,4)
          assert (version,count)==(3,3)
          off=12
          actual=[]
          for _ in range(count):
              gid,mat,n=struct.unpack_from('<iii',raw,off); off += 12
              actual.append((gid,mat,n))
              vals=struct.unpack_from('<'+'f'*(n*8),raw,off)
              assert all(math.isfinite(x) for x in vals)
              off += n*8*4
          assert actual == [(0,0,3426),(1,1,18),(2,2,720)], actual
          assert off == len(raw)
          print('V3_MESH_STRUCTURE_PASS', actual)
          PY
          grep -q 'HEAD_RENDER' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          grep -q 'INTERIOR_RENDER' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          grep -q 'TOILET_RENDER' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          grep -q 'state.laserFiring' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          grep -q 'Mob::checkMobSpawnRules' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'target.hurtServer' src/main/java/dev/ashenthefox/skibidi/entity/GToiletEntity.java
          grep -q '!this.entity.isLaserFiring()' src/client/java/dev/ashenthefox/skibidi/client/sound/GToiletLaserLoopSound.java
          test ! -f src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          test ! -f src/main/resources/data/minecraft/tags/entity_type/zombies.json
          test -f src/main/resources/assets/skibidi/textures/entity/skibidi_head.png
          test -f src/main/resources/assets/skibidi/textures/entity/skibidi_interior.png
          test -f src/main/resources/assets/skibidi/textures/entity/skibidi_toilet.png

      - name: Build and Loom remap
        working-directory: skibidi-gh-build-min
        run: gradle clean build --stacktrace --no-configuration-cache

      - name: Dedicated server combat regression
        working-directory: skibidi-gh-build-min
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          python3 -m pip install --disable-pip-version-check -q pexpect
          python3 - <<'PY' | tee ../server-v241.log
          import pexpect, re, sys, time
          child=pexpect.spawn(
              'gradle',
              ['runServer','--no-daemon','--no-configuration-cache','--console=plain'],
              cwd='.', encoding='utf-8', timeout=180, echo=False
          )
          child.logfile=sys.stdout
          child.expect(re.compile(r'Done \('))
          child.sendline('forceload add 0 0 32 32')
          time.sleep(2)
          child.sendline('kill @e[tag=laser_target]')
          child.sendline('kill @e[tag=laser_boss]')
          child.sendline('summon minecraft:villager 0 200 28 {Tags:["laser_target"],NoAI:1b,NoGravity:1b,PersistenceRequired:1b}')
          child.sendline('summon skibidi:g_toilet_2 0 200 0 {Tags:["laser_boss"],NoGravity:1b,PersistenceRequired:1b}')
          time.sleep(2)
          child.sendline('execute if data entity @e[tag=laser_boss,limit=1] {Health:650.0f} run say G2_HP_PASS')
          child.expect(re.compile(r'\[Server\] G2_HP_PASS'), timeout=30)
          for _ in range(24):
              child.sendline('tp @e[tag=laser_boss] 0 200 0')
              time.sleep(0.25)
          child.sendline('execute unless entity @e[tag=laser_target] run say LASER_KILL_PASS')
          child.expect(re.compile(r'\[Server\] LASER_KILL_PASS'), timeout=30)
          child.sendline('stop')
          child.expect(pexpect.EOF, timeout=60)
          PY
          grep -q '\[Server\] G2_HP_PASS' ../server-v241.log
          grep -q '\[Server\] LASER_KILL_PASS' ../server-v241.log
          ! grep -q 'Minecraft Crash Report' ../server-v241.log

      - name: Client renderer startup smoke
        working-directory: skibidi-gh-build-min
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          ok=0
          for i in 1 2 3; do
            if gradle downloadAssets --no-daemon --no-configuration-cache; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = 1
          set +e
          timeout 90s xvfb-run -a gradle runClient --no-daemon --no-configuration-cache > ../client-v241.log 2>&1
          code=$?
          set -e
          tail -n 220 ../client-v241.log
          grep -q 'Skibidi Toilet initialized' ../client-v241.log
          ! grep -q 'Minecraft Crash Report' ../client-v241.log
          ! grep -q 'ExceptionInInitializerError' ../client-v241.log
          ! grep -q 'Could not execute entrypoint' ../client-v241.log
          echo "client smoke exit code: $code"

      - name: Inspect production JAR
        run: |
          unzip -t skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.1.jar
          unzip -p skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.1.jar fabric.mod.json | grep -q '"version": "2.4.1"'
          unzip -l skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.1.jar | tee jar-v241.txt
          grep -q 'assets/skibidi/mesh/skibidi_v3.skbm' jar-v241.txt
          grep -q 'assets/skibidi/textures/entity/skibidi_head.png' jar-v241.txt
          grep -q 'assets/skibidi/textures/entity/skibidi_interior.png' jar-v241.txt
          grep -q 'assets/skibidi/textures/entity/skibidi_toilet.png' jar-v241.txt
          grep -q 'SkibidiMesh.class' jar-v241.txt
          grep -q 'SkibidiMeshLayer.class' jar-v241.txt
          grep -q 'GToiletEntity.class' jar-v241.txt
          grep -q 'GToiletLaserLoopSound.class' jar-v241.txt
          ! grep -q 'SkibidiZombieRenderer.class' jar-v241.txt

      - uses: actions/upload-artifact@v4
        with:
          name: skibidi-v241-final
          path: |
            skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.1.jar
            server-v241.log
            client-v241.log
            jar-v241.txt
