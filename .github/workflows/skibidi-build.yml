name: Skibidi Fabric v2.4 Renderer Fix
on:
  push:
    branches:
      - chatgpt-skibidi-build-20260919
    paths:
      - v24-trigger.txt
      - .github/workflows/skibidi-build.yml
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct latest gameplay source
        run: |
          cat chunk00.txt chunk01.txt chunk02.txt chunk03.txt | base64 -d > payload.tar.gz
          tar -xzf payload.tar.gz
          cat v2p00.txt v2p01.txt v2p02.txt v2p03.txt v2p04.txt | base64 -d > v2-patch.tar.gz
          tar -xzf v2-patch.tar.gz
          cp -a skibidi-v2-patch/. skibidi-gh-build-min/
          rm -f skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          rm -f skibidi-gh-build-min/src/main/resources/data/minecraft/tags/entity_type/zombies.json
          cp fix/SkibidiMeshLayer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          cp fix/SkibidiAttachments.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java
          base64 -d skibidi-v22-codepatch.b64 > v22-patch.tar.gz
          tar -xzf v22-patch.tar.gz
          cp -a skibidi-v2.2-codepatch/. skibidi-gh-build-min/
          cat v23f00.txt v23f01.txt v23f02.txt v23f03.txt | base64 -d > v23-final.tar.gz
          echo "b6e69e64418167b476551595c12766c8a9220faeec785b8a0ca8b34024c56c7d  v23-final.tar.gz" | sha256sum -c -
          mkdir -p v23-final
          tar -xzf v23-final.tar.gz -C v23-final
          cp -a v23-final/. skibidi-gh-build-min/
          cp v231/ModEntityTypes.java skibidi-gh-build-min/src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java

      - name: Overlay renderer root-cause fix
        run: |
          cp v24/SkibidiMesh.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMesh.java
          cp v24/SkibidiRenderer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiRenderer.java
          cp v24/SkibidiAttachments.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java
          cp v24/gradle.properties skibidi-gh-build-min/gradle.properties

      - name: Primitive topology and regression checks
        working-directory: skibidi-gh-build-min
        run: |
          grep -q 'mod_version=2.4.0' gradle.properties
          grep -q 'i += 24' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMesh.java
          test "$(grep -c 'emitPackedVertex(vertices, i + 16' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMesh.java)" = 2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java').read_text()
          a=p.index('private static void face(')
          b=p.index('private static void vertex(', a)
          face=p[a:b]
          assert face.count('vertex(pose,buffer') == 4, face.count('vertex(pose,buffer')
          print('ATTACHMENT_QUAD_TOPOLOGY_PASS')
          PY
          grep -q 'this.addLayer(new SkibidiMeshLayer' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiRenderer.java
          grep -q 'float modelX = -x \* scale' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMesh.java
          grep -q 'float modelY = 1.501F - y \* scale' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMesh.java
          grep -q 'state.laserFiring' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiRenderer.java
          grep -q '!this.entity.isLaserFiring()' src/client/java/dev/ashenthefox/skibidi/client/sound/GToiletLaserLoopSound.java
          grep -q 'G2_LASER_Y = 0.90F' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java
          grep -q 'Mob::checkMobSpawnRules' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          test ! -f src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          test ! -f src/main/resources/data/minecraft/tags/entity_type/zombies.json

      - name: Build and Loom remap
        working-directory: skibidi-gh-build-min
        run: gradle clean build --stacktrace --no-configuration-cache

      - name: Dedicated server combat regression
        working-directory: skibidi-gh-build-min
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          python3 -m pip install --disable-pip-version-check -q pexpect
          python3 - <<'PY' | tee ../server-v24.log
          import pexpect, re, sys, time
          child=pexpect.spawn(
              'gradle',
              ['runServer','--no-daemon','--no-configuration-cache','--console=plain'],
              cwd='.', encoding='utf-8', timeout=180, echo=False
          )
          child.logfile=sys.stdout
          child.expect(re.compile(r'Done \('))
          child.sendline('forceload add 0 0 32 32')
          time.sleep(2)
          child.sendline('kill @e[tag=laser_target]')
          child.sendline('kill @e[tag=laser_boss]')
          child.sendline('summon minecraft:villager 0 200 28 {Tags:["laser_target"],NoAI:1b,NoGravity:1b,PersistenceRequired:1b}')
          child.sendline('summon skibidi:g_toilet_2 0 200 0 {Tags:["laser_boss"],NoGravity:1b,PersistenceRequired:1b}')
          time.sleep(2)
          child.sendline('execute if data entity @e[tag=laser_boss,limit=1] {Health:650.0f} run say G2_HP_PASS')
          child.expect(re.compile(r'\[Server\] G2_HP_PASS'), timeout=30)
          for _ in range(24):
              child.sendline('tp @e[tag=laser_boss] 0 200 0')
              time.sleep(0.25)
          child.sendline('execute unless entity @e[tag=laser_target] run say LASER_KILL_PASS')
          child.expect(re.compile(r'\[Server\] LASER_KILL_PASS'), timeout=30)
          child.sendline('stop')
          child.expect(pexpect.EOF, timeout=60)
          PY
          grep -q '\[Server\] G2_HP_PASS' ../server-v24.log
          grep -q '\[Server\] LASER_KILL_PASS' ../server-v24.log
          ! grep -q 'Minecraft Crash Report' ../server-v24.log

      - name: Client renderer startup smoke
        working-directory: skibidi-gh-build-min
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          ok=0
          for i in 1 2 3; do
            if gradle downloadAssets --no-daemon --no-configuration-cache; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = 1
          set +e
          timeout 90s xvfb-run -a gradle runClient --no-daemon --no-configuration-cache > ../client-v24.log 2>&1
          code=$?
          set -e
          tail -n 200 ../client-v24.log
          grep -q 'Skibidi Toilet initialized' ../client-v24.log
          ! grep -q 'Minecraft Crash Report' ../client-v24.log
          ! grep -q 'ExceptionInInitializerError' ../client-v24.log
          ! grep -q 'Could not execute entrypoint' ../client-v24.log
          echo "client smoke exit code: $code"

      - name: Inspect production JAR
        run: |
          unzip -t skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.0.jar
          unzip -p skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.0.jar fabric.mod.json | grep -q '"version": "2.4.0"'
          unzip -l skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.0.jar | tee jar-v24.txt
          grep -q 'SkibidiMesh.class' jar-v24.txt
          grep -q 'SkibidiAttachments.class' jar-v24.txt
          grep -q 'GToiletEntity.class' jar-v24.txt
          grep -q 'GToiletLaserLoopSound.class' jar-v24.txt
          ! grep -q 'SkibidiZombieRenderer.class' jar-v24.txt

      - uses: actions/upload-artifact@v4
        with:
          name: skibidi-v24-code
          path: |
            skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.0.jar
            server-v24.log
            client-v24.log
            jar-v24.txt
