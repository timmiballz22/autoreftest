name: Skibidi Fabric Build
on:
  push:
    branches:
      - chatgpt-skibidi-build-20260919
    paths:
      - v2-trigger.txt
      - .github/workflows/skibidi-build.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Restore original v1 source payload
        run: |
          cat chunk00.txt chunk01.txt chunk02.txt chunk03.txt | base64 -d > payload.tar.gz
          tar -xzf payload.tar.gz
      - name: Overlay v2 source rewrite
        run: |
          cat v2p00.txt v2p01.txt v2p02.txt v2p03.txt v2p04.txt | base64 -d > v2-patch.tar.gz
          tar -xzf v2-patch.tar.gz
          cp -a skibidi-v2-patch/. skibidi-gh-build-min/
          rm -f skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          rm -f skibidi-gh-build-min/src/main/resources/data/minecraft/tags/entity_type/zombies.json
      - name: Overlay final renderer fixes
        run: |
          cp fix/SkibidiMeshLayer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          cp fix/SkibidiAttachments.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java
      - name: Overlay v2.2 laser audio patch
        run: |
          base64 -d skibidi-v22-patch.b64 > v22-patch.tar.gz
          tar -xzf v22-patch.tar.gz
          cp -a skibidi-v2.2-patch/. skibidi-gh-build-min/
      - name: Build and remap
        working-directory: skibidi-gh-build-min
        run: gradle clean build --stacktrace --no-configuration-cache
      - name: Verify laser sound and production jar
        run: |
          test -f skibidi-gh-build-min/src/main/resources/assets/skibidi/sounds/g_toilet_lasers.ogg
          grep -q G_TOILET_LASERS_LOOP skibidi-gh-build-min/src/main/java/dev/ashenthefox/skibidi/ModSounds.java
          grep -q GToiletLaserLoopSound skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/sound/SkibidiSoundController.java
          unzip -l skibidi-gh-build-min/build/libs/skibidi-toilet-2.2.0.jar | tee jar-contents-v22.txt
          grep -q 'assets/skibidi/sounds/g_toilet_lasers.ogg' jar-contents-v22.txt
          grep -q 'GToiletLaserLoopSound.class' jar-contents-v22.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skibidi-v22-compiled
          path: |
            skibidi-gh-build-min/build/libs/skibidi-toilet-2.2.0.jar
            skibidi-gh-build-min/build/libs/skibidi-toilet-2.2.0-sources.jar
            jar-contents-v22.txt
