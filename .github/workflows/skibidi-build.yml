name: Skibidi Fabric v2.4 Build
on:
  push:
    branches:
      - chatgpt-skibidi-build-20260919
    paths:
      - v240-trigger.txt
      - .github/workflows/skibidi-build.yml
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct v2.3 baseline
        run: |
          cat chunk00.txt chunk01.txt chunk02.txt chunk03.txt | base64 -d > payload.tar.gz
          tar -xzf payload.tar.gz
          cat v2p00.txt v2p01.txt v2p02.txt v2p03.txt v2p04.txt | base64 -d > v2-patch.tar.gz
          tar -xzf v2-patch.tar.gz
          cp -a skibidi-v2-patch/. skibidi-gh-build-min/
          rm -f skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          rm -f skibidi-gh-build-min/src/main/resources/data/minecraft/tags/entity_type/zombies.json
          cp fix/SkibidiMeshLayer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          cp fix/SkibidiAttachments.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java
          base64 -d skibidi-v22-codepatch.b64 > v22-patch.tar.gz
          tar -xzf v22-patch.tar.gz
          cp -a skibidi-v2.2-codepatch/. skibidi-gh-build-min/
          cat v23f00.txt v23f01.txt v23f02.txt v23f03.txt | base64 -d > v23-final.tar.gz
          echo "b6e69e64418167b476551595c12766c8a9220faeec785b8a0ca8b34024c56c7d  v23-final.tar.gz" | sha256sum -c -
          mkdir -p v23-final
          tar -xzf v23-final.tar.gz -C v23-final
          cp -a v23-final/. skibidi-gh-build-min/

      - name: Overlay v2.4 combat and spawn patch
        run: |
          base64 -d skibidi-v240-patch.b64 > v240-patch.tar.gz
          echo "06fb975517be0be8f0a7ce5a73b5a7d7b33dc3dc33897e11d6c47cc8236d4f5d  v240-patch.tar.gz" | sha256sum -c -
          tar -xzf v240-patch.tar.gz -C skibidi-gh-build-min
          cp v240/ModDamageTypes.java skibidi-gh-build-min/src/main/java/dev/ashenthefox/skibidi/ModDamageTypes.java

      - name: Static regression checks
        working-directory: skibidi-gh-build-min
        run: |
          grep -q 'mod_version=2.4.0' gradle.properties
          test -f src/main/resources/data/skibidi/damage_type/g_toilet_laser.json
          grep -q 'skibidi:g_toilet_laser' src/main/resources/data/minecraft/tags/damage_type/no_knockback.json
          grep -q 'Mob::checkMobSpawnRules' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'addOverworldSpawn(SKIBIDI, 100' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'addOverworldSpawn(SKIBIDI_KING, 8' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'addOverworldSpawn(G_TOILET, 4' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'addOverworldSpawn(G_TOILET_2, 2' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'addOverworldSpawn(G_TOILET_3, 1' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          ! grep -q 'RangedAttackGoal' src/main/java/dev/ashenthefox/skibidi/entity/GToiletEntity.java
          ! grep -q 'implements RangedAttackMob' src/main/java/dev/ashenthefox/skibidi/entity/GToiletEntity.java
          grep -q 'LASER_WARNING' src/main/java/dev/ashenthefox/skibidi/entity/GToiletEntity.java
          grep -q 'previousVelocity' src/main/java/dev/ashenthefox/skibidi/entity/GToiletEntity.java
          grep -q 'prismBetween' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java
          grep -q 'laserWarning' src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          grep -q '!this.entity.isLaserFiring()' src/client/java/dev/ashenthefox/skibidi/client/sound/GToiletLaserLoopSound.java
          test ! -f src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          test ! -f src/main/resources/data/minecraft/tags/entity_type/zombies.json

      - name: Build and Loom remap
        working-directory: skibidi-gh-build-min
        run: gradle clean build --stacktrace --no-configuration-cache

      - name: Dedicated server combat test
        working-directory: skibidi-gh-build-min
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          python3 -m pip install --disable-pip-version-check -q pexpect
          python3 - <<'PY' | tee ../server-v240.log
          import pexpect, re, sys, time

          child=pexpect.spawn(
              'gradle',
              ['runServer','--no-daemon','--no-configuration-cache','--console=plain'],
              cwd='.', encoding='utf-8', timeout=240, echo=False
          )
          child.logfile=sys.stdout
          child.expect(re.compile(r'Done \('))
          child.sendline('forceload add 0 0 32 32')
          child.sendline('scoreboard objectives add sktest dummy')
          time.sleep(1.0)

          # Clean slate: type selectors are reliable on 1.21.11 even when NBT Tags are delayed.
          child.sendline('kill @e[type=minecraft:villager]')
          child.sendline('kill @e[type=skibidi:g_toilet_2]')
          time.sleep(0.5)

          # Long-range angled target proves the laser aims at a non-axis-aligned location.
          child.sendline('summon minecraft:villager 8 200 24 {NoAI:1b,NoGravity:1b,PersistenceRequired:1b}')
          child.expect(re.compile(r'Summoned new Villager'), timeout=30)
          time.sleep(1.0)
          child.sendline('attribute @e[type=minecraft:villager,limit=1] minecraft:max_health base set 500')
          child.expect(re.compile(r'base value.*500\.0'), timeout=30)
          child.sendline('data merge entity @e[type=minecraft:villager,limit=1] {Health:500.0f}')
          time.sleep(0.5)

          child.sendline('summon skibidi:g_toilet_2 0 200 0 {NoGravity:1b,PersistenceRequired:1b}')
          child.expect(re.compile(r'Summoned new G-Toilet 2\.0'), timeout=30)
          time.sleep(1.0)
          child.sendline('attribute @e[type=skibidi:g_toilet_2,limit=1] minecraft:movement_speed base set 0')
          child.expect(re.compile(r'base value.*Speed.*0\.0'), timeout=30)

          # Cooldown + tracking warning + firing window.
          time.sleep(5.5)
          child.sendline('execute store result score #hp sktest run data get entity @e[type=minecraft:villager,limit=1] Health 10')
          time.sleep(0.2)
          child.sendline('execute if score #hp sktest matches 1..4999 run say LASER_DAMAGE_PASS')
          child.expect(re.compile(r'\[Server\] LASER_DAMAGE_PASS'), timeout=30)

          # Laser damage must not impart velocity.
          child.sendline('execute store result score #mx sktest run data get entity @e[type=minecraft:villager,limit=1] Motion[0] 100000')
          child.sendline('execute store result score #my sktest run data get entity @e[type=minecraft:villager,limit=1] Motion[1] 100000')
          child.sendline('execute store result score #mz sktest run data get entity @e[type=minecraft:villager,limit=1] Motion[2] 100000')
          time.sleep(0.3)
          child.sendline('execute if score #mx sktest matches 0 if score #my sktest matches 0 if score #mz sktest matches 0 run say LASER_NO_KNOCKBACK_PASS')
          child.expect(re.compile(r'\[Server\] LASER_NO_KNOCKBACK_PASS'), timeout=30)

          # Clean slate again.
          child.sendline('kill @e[type=minecraft:villager]')
          child.sendline('kill @e[type=skibidi:g_toilet_2]')
          time.sleep(0.7)

          # Inside 3 blocks, laser startup is disabled; inherited zombie melee must still kill.
          child.sendline('summon minecraft:villager 0 200 1 {NoAI:1b,NoGravity:1b,PersistenceRequired:1b}')
          child.expect(re.compile(r'Summoned new Villager'), timeout=30)
          time.sleep(1.0)
          child.sendline('summon skibidi:g_toilet_2 0 200 0 {NoGravity:1b,PersistenceRequired:1b}')
          child.expect(re.compile(r'Summoned new G-Toilet 2\.0'), timeout=30)
          time.sleep(1.0)
          child.sendline('attribute @e[type=skibidi:g_toilet_2,limit=1] minecraft:movement_speed base set 0')
          child.expect(re.compile(r'base value.*Speed.*0\.0'), timeout=30)
          time.sleep(10.0)
          child.sendline('execute unless entity @e[type=minecraft:villager,limit=1] run say MELEE_STILL_WORKS_PASS')
          child.expect(re.compile(r'\[Server\] MELEE_STILL_WORKS_PASS'), timeout=30)

          child.sendline('stop')
          child.expect(pexpect.EOF, timeout=90)
          PY
          grep -q '\[Server\] LASER_DAMAGE_PASS' ../server-v240.log
          grep -q '\[Server\] LASER_NO_KNOCKBACK_PASS' ../server-v240.log
          grep -q '\[Server\] MELEE_STILL_WORKS_PASS' ../server-v240.log
          ! grep -q 'Minecraft Crash Report' ../server-v240.log

      - name: Inspect production JAR
        run: |
          unzip -t skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.0.jar
          unzip -p skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.0.jar fabric.mod.json | grep -q '"version": "2.4.0"'
          unzip -l skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.0.jar | tee jar-v240.txt
          grep -q 'ModDamageTypes.class' jar-v240.txt
          grep -q 'GToiletEntity.class' jar-v240.txt
          grep -q 'SkibidiAttachments.class' jar-v240.txt
          grep -q 'data/skibidi/damage_type/g_toilet_laser.json' jar-v240.txt
          grep -q 'data/minecraft/tags/damage_type/no_knockback.json' jar-v240.txt
          ! grep -q 'SkibidiZombieRenderer.class' jar-v240.txt

      - uses: actions/upload-artifact@v4
        with:
          name: skibidi-v240-code
          path: |
            skibidi-gh-build-min/build/libs/skibidi-toilet-2.4.0.jar
            server-v240.log
            jar-v240.txt
