name: Skibidi Fabric v2.3.2 Model Fix
on:
  push:
    branches:
      - chatgpt-skibidi-build-20260919
    paths:
      - v232-trigger.txt
      - .github/workflows/skibidi-build.yml
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct exact delivered v2.3.1 source
        run: |
          cat chunk00.txt chunk01.txt chunk02.txt chunk03.txt | base64 -d > payload.tar.gz
          tar -xzf payload.tar.gz
          cat v2p00.txt v2p01.txt v2p02.txt v2p03.txt v2p04.txt | base64 -d > v2-patch.tar.gz
          tar -xzf v2-patch.tar.gz
          cp -a skibidi-v2-patch/. skibidi-gh-build-min/
          rm -f skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          rm -f skibidi-gh-build-min/src/main/resources/data/minecraft/tags/entity_type/zombies.json
          cp fix/SkibidiMeshLayer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          cp fix/SkibidiAttachments.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java
          base64 -d skibidi-v22-codepatch.b64 > v22-patch.tar.gz
          tar -xzf v22-patch.tar.gz
          cp -a skibidi-v2.2-codepatch/. skibidi-gh-build-min/
          cat v23f00.txt v23f01.txt v23f02.txt v23f03.txt | base64 -d > v23-final.tar.gz
          echo "b6e69e64418167b476551595c12766c8a9220faeec785b8a0ca8b34024c56c7d  v23-final.tar.gz" | sha256sum -c -
          mkdir -p v23-final
          tar -xzf v23-final.tar.gz -C v23-final
          cp -a v23-final/. skibidi-gh-build-min/
          cp v231/ModEntityTypes.java skibidi-gh-build-min/src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          cp v231/gradle.properties skibidi-gh-build-min/gradle.properties
          sed -i 's/mod_version=2.3.1/mod_version=2.3.2/' skibidi-gh-build-min/gradle.properties

      - name: Apply material-correct renderer
        run: |
          cp v232/SkibidiMeshLayer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java')
          s=p.read_text()
          pattern=r'\n\s*if \(variant\.hasGlowingEyes\(\)\) \{.*?\n\s*\}\n\n(?=\s*if \(variant == SkibidiVariant\.G_TOILET\))'
          s2,n=re.subn(pattern,'\n\n',s,count=1,flags=re.S)
          assert n==1, 'fake eye geometry block not found'
          p.write_text(s2)
          PY

      - name: Rebuild runtime mesh directly from original uploaded glTF
        run: |
          test -f skibidi-gh-build-min/source-assets/skibidi-toilet-minecraft-model.zip
          rm -rf original-model
          mkdir original-model
          unzip -q skibidi-gh-build-min/source-assets/skibidi-toilet-minecraft-model.zip -d original-model
          mkdir -p skibidi-gh-build-min/src/main/resources/assets/skibidi/mesh
          mkdir -p skibidi-gh-build-min/src/main/resources/assets/skibidi/textures/entity
          cp original-model/textures/gltf_embedded_0.png skibidi-gh-build-min/src/main/resources/assets/skibidi/textures/entity/skibidi_head.png
          cp original-model/textures/gltf_embedded_1.png skibidi-gh-build-min/src/main/resources/assets/skibidi/textures/entity/skibidi_interior.png
          cp original-model/textures/gltf_embedded_2.png skibidi-gh-build-min/src/main/resources/assets/skibidi/textures/entity/skibidi_toilet.png
          python3 - <<'PY'
          import json, base64, struct
          from pathlib import Path

          gltf_path=Path('original-model/source/model.gltf')
          out=Path('skibidi-gh-build-min/src/main/resources/assets/skibidi/mesh/skibidi_v2.skbm')
          g=json.loads(gltf_path.read_text())
          uri=g['buffers'][0]['uri']
          assert uri.startswith('data:application/octet-stream;base64,')
          buf=base64.b64decode(uri.split(',',1)[1])
          comp_fmt={5120:'b',5121:'B',5122:'h',5123:'H',5125:'I',5126:'f'}
          comp_count={'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4,'MAT2':4,'MAT3':9,'MAT4':16}

          def accessor(idx):
              a=g['accessors'][idx]
              assert not a.get('sparse')
              view=g['bufferViews'][a['bufferView']]
              code=comp_fmt[a['componentType']]
              n=comp_count[a['type']]
              scalar_size=struct.calcsize('<'+code)
              stride=view.get('byteStride', n*scalar_size)
              offset=view.get('byteOffset',0)+a.get('byteOffset',0)
              result=[]
              for i in range(a['count']):
                  values=struct.unpack_from('<'+code*n,buf,offset+i*stride)
                  result.append(values[0] if n==1 else tuple(float(v) for v in values))
              return result

          groups={
              0:{'material':0,'verts':[]},
              1:{'material':0,'verts':[]},
              2:{'material':0,'verts':[]},
              3:{'material':1,'verts':[]},
              4:{'material':2,'verts':[]},
          }
          def group_for(name):
              if name in {'ojo_D','ojo_I'}: return 1
              if name in {'pupila_D','pupila_I'}: return 2
              if name=='interior': return 3
              if name=='Escusado': return 4
              return 0

          for node in g['nodes']:
              if 'mesh' not in node:
                  continue
              gid=group_for(node.get('name',''))
              for prim in g['meshes'][node['mesh']]['primitives']:
                  assert prim.get('mode',4)==4
                  assert prim.get('material',0)==groups[gid]['material']
                  pos=accessor(prim['attributes']['POSITION'])
                  nor=accessor(prim['attributes']['NORMAL'])
                  uv=accessor(prim['attributes']['TEXCOORD_0'])
                  indices=accessor(prim['indices'])
                  for raw_i in indices:
                      i=int(raw_i)
                      x,y,z=pos[i]; nx,ny,nz=nor[i]; u,v=uv[i]
                      groups[gid]['verts'].append((x,y,z,u,v,nx,ny,nz))

          assert [len(groups[i]['verts']) for i in range(5)] == [3282,72,72,18,720]
          with out.open('wb') as f:
              f.write(b'SKB2')
              f.write(struct.pack('<ii',2,5))
              for gid in range(5):
                  part=groups[gid]
                  f.write(struct.pack('<iii',gid,part['material'],len(part['verts'])))
                  for vert in part['verts']:
                      f.write(struct.pack('<8f',*vert))
          PY

      - name: Validate exact model reconstruction
        run: |
          cmp original-model/textures/gltf_embedded_0.png skibidi-gh-build-min/src/main/resources/assets/skibidi/textures/entity/skibidi_head.png
          cmp original-model/textures/gltf_embedded_1.png skibidi-gh-build-min/src/main/resources/assets/skibidi/textures/entity/skibidi_interior.png
          cmp original-model/textures/gltf_embedded_2.png skibidi-gh-build-min/src/main/resources/assets/skibidi/textures/entity/skibidi_toilet.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path('skibidi-gh-build-min/src/main/resources/assets/skibidi/mesh/skibidi_v2.skbm')
          b=p.read_bytes()
          assert b[:4]==b'SKB2'
          off=4
          version,count=struct.unpack_from('<ii',b,off); off+=8
          assert (version,count)==(2,5)
          expected=[(0,0,3282),(1,0,72),(2,0,72),(3,1,18),(4,2,720)]
          got=[]
          for _ in range(count):
              gid,mat,n=struct.unpack_from('<iii',b,off); off+=12
              got.append((gid,mat,n))
              off += n*8*4
          assert got==expected, got
          assert off==len(b)
          print('MODEL_ASSET_VALIDATION_PASS',got)
          PY
          grep -q 'HEAD_TEXTURE' skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          grep -q 'INTERIOR_TEXTURE' skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          grep -q 'TOILET_TEXTURE' skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          ! grep -q -- '-0.16F, 1.69F, -0.345F, 0.13F' skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java

      - name: Build and Loom remap
        working-directory: skibidi-gh-build-min
        run: gradle clean build --stacktrace --no-configuration-cache

      - name: Dedicated server combat regression
        working-directory: skibidi-gh-build-min
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          python3 -m pip install --disable-pip-version-check -q pexpect
          python3 - <<'PY' | tee ../server-v232.log
          import pexpect, re, sys, time
          child=pexpect.spawn('gradle',['runServer','--no-daemon','--no-configuration-cache','--console=plain'],cwd='.',encoding='utf-8',timeout=220,echo=False)
          child.logfile=sys.stdout
          child.expect(re.compile(r'Done \('))
          child.sendline('forceload add 0 0 32 32')
          child.sendline('kill @e[type=minecraft:villager]')
          child.sendline('kill @e[type=skibidi:g_toilet_2]')
          time.sleep(1)
          child.sendline('summon minecraft:villager 0 200 28 {NoAI:1b,NoGravity:1b,PersistenceRequired:1b}')
          child.expect(re.compile(r'Summoned new Villager'),timeout=30)
          child.sendline('summon skibidi:g_toilet_2 0 200 0 {NoGravity:1b,PersistenceRequired:1b}')
          child.expect(re.compile(r'Summoned new G-Toilet 2\.0'),timeout=30)
          child.sendline('attribute @e[type=skibidi:g_toilet_2,limit=1] minecraft:movement_speed base set 0')
          time.sleep(10)
          child.sendline('execute unless entity @e[type=minecraft:villager,limit=1] run say LASER_REGRESSION_PASS')
          child.expect(re.compile(r'\[Server\] LASER_REGRESSION_PASS'),timeout=30)
          child.sendline('stop')
          child.expect(pexpect.EOF,timeout=60)
          PY
          grep -q '\[Server\] LASER_REGRESSION_PASS' ../server-v232.log
          ! grep -q 'Minecraft Crash Report' ../server-v232.log

      - name: Client startup smoke test
        working-directory: skibidi-gh-build-min
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          ok=0
          for i in 1 2 3; do
            if gradle downloadAssets --no-daemon --no-configuration-cache; then ok=1; break; fi
            sleep 8
          done
          test "$ok" = 1
          set +e
          timeout 90s xvfb-run -a gradle runClient --no-daemon --no-configuration-cache > ../client-v232.log 2>&1
          code=$?
          set -e
          tail -n 200 ../client-v232.log
          grep -q 'Skibidi Toilet initialized' ../client-v232.log
          ! grep -q 'Minecraft Crash Report' ../client-v232.log
          ! grep -q 'ExceptionInInitializerError' ../client-v232.log
          ! grep -q 'Could not execute entrypoint' ../client-v232.log
          echo "client smoke exit code: $code"

      - name: Inspect production JAR resources
        run: |
          JAR=skibidi-gh-build-min/build/libs/skibidi-toilet-2.3.2.jar
          unzip -t "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"version": "2.3.2"'
          unzip -l "$JAR" | tee jar-v232.txt
          grep -q 'assets/skibidi/mesh/skibidi_v2.skbm' jar-v232.txt
          grep -q 'assets/skibidi/textures/entity/skibidi_head.png' jar-v232.txt
          grep -q 'assets/skibidi/textures/entity/skibidi_interior.png' jar-v232.txt
          grep -q 'assets/skibidi/textures/entity/skibidi_toilet.png' jar-v232.txt
          grep -q 'assets/skibidi/sounds/g_toilet_lasers.ogg' jar-v232.txt
          grep -q 'GToiletEntity.class' jar-v232.txt
          grep -q 'SkibidiMeshLayer.class' jar-v232.txt
          ! grep -q 'SkibidiZombieRenderer.class' jar-v232.txt

      - uses: actions/upload-artifact@v4
        with:
          name: skibidi-v232-final
          path: |
            skibidi-gh-build-min/build/libs/skibidi-toilet-2.3.2.jar
            server-v232.log
            client-v232.log
            jar-v232.txt
