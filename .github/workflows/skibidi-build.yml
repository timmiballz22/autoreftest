name: Skibidi Fabric v2.3.1 Build
on:
  push:
    branches:
      - chatgpt-skibidi-build-20260919
    paths:
      - v231-trigger.txt
      - .github/workflows/skibidi-build.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Reconstruct v2.3 source
        run: |
          cat chunk00.txt chunk01.txt chunk02.txt chunk03.txt | base64 -d > payload.tar.gz
          tar -xzf payload.tar.gz
          cat v2p00.txt v2p01.txt v2p02.txt v2p03.txt v2p04.txt | base64 -d > v2-patch.tar.gz
          tar -xzf v2-patch.tar.gz
          cp -a skibidi-v2-patch/. skibidi-gh-build-min/
          rm -f skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiZombieRenderer.java
          rm -f skibidi-gh-build-min/src/main/resources/data/minecraft/tags/entity_type/zombies.json
          cp fix/SkibidiMeshLayer.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiMeshLayer.java
          cp fix/SkibidiAttachments.java skibidi-gh-build-min/src/client/java/dev/ashenthefox/skibidi/client/render/SkibidiAttachments.java
          base64 -d skibidi-v22-codepatch.b64 > v22-patch.tar.gz
          tar -xzf v22-patch.tar.gz
          cp -a skibidi-v2.2-codepatch/. skibidi-gh-build-min/
          cat v23f00.txt v23f01.txt v23f02.txt v23f03.txt | base64 -d > v23-final.tar.gz
          echo "b6e69e64418167b476551595c12766c8a9220faeec785b8a0ca8b34024c56c7d  v23-final.tar.gz" | sha256sum -c -
          mkdir -p v23-final
          tar -xzf v23-final.tar.gz -C v23-final
          cp -a v23-final/. skibidi-gh-build-min/
      - name: Overlay any-light spawn patch
        run: |
          base64 -d skibidi-v231-patch.b64 > v231-patch.tar.gz
          sha256sum v231-patch.tar.gz
          tar -tzf v231-patch.tar.gz
          tar -xzf v231-patch.tar.gz
          cp -a skibidi-v231-patch/. skibidi-gh-build-min/
      - name: Verify spawn rule source
        working-directory: skibidi-gh-build-min
        run: |
          grep -q 'mod_version=2.3.1' gradle.properties
          grep -q 'SpawnPlacements.register' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'Mob::checkMobSpawnRules' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'BiomeSelectors.foundInOverworld()' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          grep -q 'BiomeModifications.addSpawn' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
          ! grep -q 'checkMonsterSpawnRules' src/main/java/dev/ashenthefox/skibidi/ModEntityTypes.java
      - name: Build and Loom remap
        working-directory: skibidi-gh-build-min
        run: gradle clean build --stacktrace --no-configuration-cache
      - name: Dedicated server startup test
        working-directory: skibidi-gh-build-min
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 75s gradle runServer --no-daemon --no-configuration-cache > ../server-v231.log 2>&1
          code=$?
          set -e
          tail -n 180 ../server-v231.log
          grep -q 'Skibidi Toilet initialized' ../server-v231.log
          grep -q 'Done (' ../server-v231.log
          ! grep -q 'Minecraft Crash Report' ../server-v231.log
          ! grep -q 'Could not execute entrypoint' ../server-v231.log
          echo "server smoke exit code: $code"
      - name: Inspect production jar
        run: |
          unzip -t skibidi-gh-build-min/build/libs/skibidi-toilet-2.3.1.jar
          unzip -p skibidi-gh-build-min/build/libs/skibidi-toilet-2.3.1.jar fabric.mod.json | grep -q '"version": "2.3.1"'
          unzip -l skibidi-gh-build-min/build/libs/skibidi-toilet-2.3.1.jar | tee jar-code-v231.txt
          grep -q 'ModEntityTypes.class' jar-code-v231.txt
          grep -q 'GToiletEntity.class' jar-code-v231.txt
          grep -q 'GToiletLaserLoopSound.class' jar-code-v231.txt
          ! grep -q 'SkibidiZombieRenderer.class' jar-code-v231.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skibidi-v231-code
          path: |
            skibidi-gh-build-min/build/libs/skibidi-toilet-2.3.1.jar
            server-v231.log
            jar-code-v231.txt
