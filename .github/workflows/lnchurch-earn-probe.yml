name: Confirm daily earning receipt
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import requests,json
          u='https://furryfragz-agent-earn-hub.vercel.app/status.json'
          r=requests.get(u,timeout=16)
          print('HTTP',r.status_code)
          try:print('CHECKIN',json.dumps(r.json(),ensure_ascii=False)[:18000])
          except Exception as e:print('INVALID_JSON',str(e)[:100])
          PY
