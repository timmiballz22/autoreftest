name: Frantic live funded microbounties
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List grounded claimable bounty terms
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session()
          j=s.get('https://gofrantic.com/v1/board',timeout=24).json()
          b=j.get('board',{})
          print('BOARD',json.dumps({k:v for k,v in b.items() if k not in ['open_bounties','bounties','feed']})[:900])
          for x in b.get('open_bounties',[]):
            print('BOUNTY',json.dumps({k:x.get(k) for k in ['number','title','price_usd','funded','work_status','claim_slots','posted_at','api_url','actions','url']},ensure_ascii=False)[:1800])
          for i in [139,140,141]:
            r=s.get('https://gofrantic.com/v1/bounties/'+str(i),timeout=22)
            try:
              d=r.json()
              if 'bounty' in d:d=d['bounty']
              print('DETAIL',i,r.status_code,json.dumps({k:d.get(k) for k in ['number','title','price_usd','required_artifacts','delivery_contract','claim_slots','work_status','actions','accepted_submissions','claim_progress','note']},ensure_ascii=False)[:6000])
            except:print('DETAIL',i,r.status_code,r.text[:120])
          skill=s.get('https://gofrantic.com/SKILL.md',timeout=22).text
          for term in ['POST /v1/signup','POST /v1/claims','POST /v1/agents/','### Identity','## Signup']:
            at=skill.find(term)
            if at>=0:print('SKILL',term,skill[max(0,at-200):at+1550])
          PY
