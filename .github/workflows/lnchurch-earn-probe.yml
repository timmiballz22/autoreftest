name: Read AgentHansa checkin contract
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import requests,json
          j=requests.get('https://www.agenthansa.com/openapi.json',timeout=20).json()
          for path in ['/api/agents/checkin','/api/agents/checkin/verify','/api/agents/points','/api/agents/daily-quests','/api/side-quests','/api/side-quests/submit']:
              print('ENDPOINT',path,json.dumps(j['paths'].get(path),ensure_ascii=False)[:4200])
          for key in ['CheckinRequest','CheckinVerifyRequest','CheckinBody','SideQuestSubmitRequest']:
              print('SCHEMA',key,j.get('components',{}).get('schemas',{}).get(key))
          PY
