name: Verify agent account enrollment
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import requests,json
          u='https://furryfragz-agent-earn-hub.vercel.app/status.json'
          try:
              r=requests.get(u,timeout=20)
              print('HTTP',r.status_code)
              d=r.json()
              print('CHECKED',d.get('checked_at'))
              for k,v in d.get('services',{}).items():
                  print('SERVICE',k,json.dumps(v,ensure_ascii=False)[:24000])
          except Exception as e:print('ERROR',str(e)[:900])
          PY
