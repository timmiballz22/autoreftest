name: Legitimate AI paid-task discovery
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Rank actual paid opportunities without risking deposits
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          urlmap={
            "basedagents":"https://api.basedagents.ai/v1/tasks?status=open",
            "agenthansa_offers":"https://www.agenthansa.com/api/offers/public",
            "agenthansa_quests":"https://www.agenthansa.com/api/alliance-war/quests",
            "taskmarket":"https://api.taskmarket.dev/api/tasks"
          }
          for name,url in urlmap.items():
            try:
              with urllib.request.urlopen(url,timeout=20) as r:j=json.loads(r.read(200000))
            except Exception as e:print("ERROR",name,str(e)[:150],flush=True);continue
            if name=="basedagents":
              t=j.get("tasks",[])
              print("COUNT",name,len(t))
              for x in t:
                b=x.get("bounty") or {}
                if not b and not x.get("bounty_amount"):continue
                print("BA",x.get("task_id"),repr(x.get("title"))[:90],"PAY",b.get("amount_display") or x.get("bounty_amount"),"FUNDED", (x.get("escrow") or {}).get("status"),"CLAIM",x.get("claimable"),"NETWORK",b.get("network"),"PREQ",repr(x.get("description"))[:210],flush=True)
            elif name=="taskmarket":
              t=j.get("tasks",[])
              print("COUNT",name,len(t))
              for x in t:
                if x.get("status")=="open" and x.get("submissionWindowOpen") and not x.get("stakeRequired"):
                  print("TM",x.get("id"),x.get("referenceCode"),"REWARD",x.get("reward"),"MODE",x.get("mode"),"EXPIRES",x.get("expiryTime"),"DESC",repr(x.get("description"))[:420],flush=True)
            elif name=="agenthansa_quests":
              print("QUEST_KEYS",list(j)[:20],"QUOTA",j.get("pagination"),flush=True)
              for k,v in j.items():
                if isinstance(v,list):
                  print("QUEST_ARRAY",k,len(v))
                  for x in v[:30]:
                    print("AHQ",str({f:x.get(f) for f in ["id","title","status","type","reward_amount","reward","prize_usdc","submission_count","deadline","ends_at"]}),flush=True)
            else:
              print("OFFER_KEYS",list(j)[:25] if isinstance(j,dict) else "list","RAW",str(j)[:3500],flush=True)
          PY
