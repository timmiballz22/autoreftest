name: Agent-native survey readiness
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect survey report shape for valid honest answers
        shell: bash
        run: |
          python -m pip install -q -U ln-church-agent
          python - <<'PY'
          import inspect
          from ln_church_agent import StructuredResponseClient
          c=StructuredResponseClient.prepare_answer.__globals__['c']
          lines=inspect.getsource(c.validate_answer).splitlines()
          print("VALIDATE_TAIL","\n".join(lines[42:]),flush=True)
          print("DEFINITIONS",inspect.getsource(c.validate_definition_items)[-9000:],flush=True)
          PY
