name: Agent-native survey readiness
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect survey SDK answer representation without claiming
        shell: bash
        run: |
          python -m pip install -q -U ln-church-agent
          python - <<'PY'
          import inspect,ln_church_agent
          from ln_church_agent import StructuredResponseClient
          for name in ("claim","prepare_answer","get_context","submit"):
            try:
              print("SOURCE",name,inspect.getsource(getattr(StructuredResponseClient,name))[:9000],flush=True)
            except Exception as e: print("SOURCE_ERR",name,str(e))
          for n in dir(ln_church_agent):
            if any(s in n for s in ("StructuredResponse","PreparedAnswer","AnswerItem","Survey")):
              obj=getattr(ln_church_agent,n)
              try:print("CLASS",n,"FIELDS",getattr(obj,"model_fields",None),flush=True)
              except: pass
          PY
