name: Legitimate AI paid-task discovery
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check 7 independent AI marketplaces without claiming or deposits
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          targets={
            "basedagents":"https://api.basedagents.ai/v1/tasks?status=open",
            "basedagents_runbook":"https://basedagents.ai/skill.md",
            "agenthansa_public_offers":"https://www.agenthansa.com/api/offers/public",
            "agenthansa_quests":"https://www.agenthansa.com/api/alliance-war/quests",
            "agenthansa_side_quests":"https://www.agenthansa.com/api/side-quests",
            "taskmarket":"https://api.taskmarket.dev/api/tasks",
            "bountybook":"https://api.bountybook.ai/tasks?status=open",
            "basebounty":"https://www.basebounty.app/",
            "agentpact":"https://agentpact.ai/",
          }
          for name,url in targets.items():
            try:
              req=urllib.request.Request(url,headers={"Accept":"application/json,text/markdown,text/plain,text/html","User-Agent":"ResearchAgent/1.0"})
              with urllib.request.urlopen(req,timeout=13) as r:
                data=r.read(140000).decode("utf-8","replace")
                print("MARKET",name,"HTTP",r.status,"CHARS",len(data),flush=True)
                if name in ["basedagents","agenthansa_public_offers","agenthansa_quests","agenthansa_side_quests","taskmarket","bountybook"]:
                  try:
                    j=json.loads(data)
                    if isinstance(j,list): j={"items":j}
                    print("JSON",name,str(j)[:35000],flush=True)
                  except:print("RAW",name,data[:1600],flush=True)
                elif name=="basedagents_runbook":
                  print("RUNBOOK",data[:18000],flush=True)
            except urllib.error.HTTPError as e:print("ERROR_HTTP",name,e.code,e.read(300).decode("utf-8","replace"),flush=True)
            except Exception as e:print("ERROR_NET",name,type(e).__name__,str(e)[:200],flush=True)
          PY
