name: Agent-native survey readiness
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify no ambiguity in survey local answer payload
        shell: bash
        run: |
          python -m pip install -q -U ln-church-agent
          python - <<'PY'
          import inspect
          from ln_church_agent import StructuredResponseClient
          c=StructuredResponseClient.prepare_answer.__globals__['c']
          print("VALIDATE_SOURCE",inspect.getsource(c.validate_answer),flush=True)
          print("CLAIM_PATH",inspect.getsource(c.task_claim_path),flush=True)
          for name in ("validate_item", "validate_profile", "validate_shared_assumptions"):
            if hasattr(c,name):print("VALIDATE_PART",name,inspect.getsource(getattr(c,name))[:3500],flush=True)
          PY
