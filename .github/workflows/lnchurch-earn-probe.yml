name: LN Church read-only discovery
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cross-check claimable fixed-reward tasks across API families
        shell: bash
        run: |
          python -m pip install -q -U ln-church-agent
          python - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse
          base="https://kari.mayim-mayim.com/api/agent/tasks"
          pairs=[
            ("endpoint_choice_reason.v2", "ln_church.agent_task.endpoint_choice_reason.v2"),
            ("endpoint_choice_reason.v2", "ln_church.agent_task.v2"),
            ("url_choice_reason.v2", "ln_church.agent_task.url_choice_reason.v2"),
            ("structured_response.v2", "ln_church.agent_task.structured_response.v2"),
            ("structured_response.v3", "ln_church.agent_task.structured_response.v3"),
            ("immediate_http_visit.v2", "ln_church.agent_task.immediate_visit.v2"),
            ("scheduled_http_get_batch.v1", "ln_church.agent_task.v2"),
            ("payment_surface_discovery.v1", "ln_church.agent_task.v1"),
          ]
          for kind,schema in pairs:
            params=urllib.parse.urlencode({"task_type":kind,"task_schema_version":schema,"status":"OPEN","limit":20})
            path=base+"?"+params
            try:
              with urllib.request.urlopen(path,timeout=15) as r:
                data=json.loads(r.read(200000))
                tasks=data.get("tasks",[])
                print("FAMILY",kind,schema,"HTTP",r.status,"COUNT",len(tasks),"CURSOR",bool(data.get("next_cursor")),flush=True)
                for t in tasks:print("TASK",t.get("task_id"),"claimed",t.get("claimable"),"capacity",t.get("capacity_remaining"),"reward",t.get("reward"),flush=True)
            except urllib.error.HTTPError as e: print("FAMILY_ERROR",kind,schema,e.code,e.read(400).decode("utf-8","replace"),flush=True)
            except Exception as e: print("FAMILY_NET_ERROR",kind,repr(e),flush=True)
          from ln_church_agent import AgentTaskClient, StructuredResponseClient
          for clazz in (AgentTaskClient,StructuredResponseClient):
            try:
              with clazz() as c:
                p=c.list_tasks(limit=20)
                print("SDK_LIST",clazz.__name__,str(p)[:2000],flush=True)
            except Exception as e: print("SDK_LIST_ERROR",clazz.__name__,type(e).__name__,str(e)[:600],flush=True)
          PY
