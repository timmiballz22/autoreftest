name: Verify paid earning action
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import requests,json
          r=requests.get('https://furryfragz-agent-earn-hub.vercel.app/status.json',timeout=18)
          print('HTTP',r.status_code)
          try:print('EARNING_RESULT',json.dumps(r.json(),ensure_ascii=False)[:16000])
          except Exception as e:print('ERROR',str(e)[:200])
          PY
