name: Agent-native survey readiness
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read all live paid survey questions before any claim
        shell: bash
        run: |
          python -m pip install -q -U ln-church-agent
          python - <<'PY'
          import urllib.request,json,inspect,ln_church_agent
          base="https://kari.mayim-mayim.com"
          tid="task_886d255e5a0c390f23a9382b6b57475c"
          u=base+"/api/agent/tasks/"+tid+"?task_type=structured_response.v3&task_schema_version=ln_church.agent_task.structured_response.v3"
          with urllib.request.urlopen(u,timeout=15) as r:j=json.load(r)
          print("TASK",j.get("task_id"),"TITLE",j.get("title"),"REWARD",j.get("reward"),"PARTICIPATION",j.get("participation"))
          for k,v in j.items():
            if k not in ("items",): print("TOP",k,str(v)[:1000])
          for x in j.get("items",[]):
            print("ITEM",x["item_id"],"axis",x["axis"],"kind",x["kind"],"statuses",x.get("allowed_statuses"),"question",x.get("question",{}).get("en"),flush=True)
          for cls in (ln_church_agent.StructuredResponseClient,):
            for n in ("claim","get_context","prepare_answer","submit"):
              fn=getattr(cls,n);print("METHOD",n,inspect.signature(fn),inspect.getdoc(fn),flush=True)
          PY
