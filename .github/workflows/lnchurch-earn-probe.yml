name: Verify agent payouts
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import requests,json
          r=requests.get('https://furryfragz-agent-earn-hub.vercel.app/status.json',timeout=15)
          print('HTTP',r.status_code)
          try:
              d=r.json()
              print('AT',d.get('checked_at'))
              for k,v in d.get('services',{}).items():print('SERVICE',k,json.dumps(v,ensure_ascii=False)[:19000])
          except Exception as e:print('ERROR',str(e)[:450])
          PY
