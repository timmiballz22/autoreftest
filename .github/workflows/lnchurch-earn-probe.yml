name: Agent-native survey readiness
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect report serializer
        shell: bash
        run: |
          python -m pip install -q -U ln-church-agent
          python - <<'PY'
          import inspect
          from ln_church_agent import StructuredResponseClient
          c=StructuredResponseClient.prepare_answer.__globals__['c']
          print("APS_REPORT",inspect.getsource(c._aps_report),flush=True)
          for k in ("a1_2","a1_4","category","competitors"):
            print("REPORT_FIELDS",k,getattr(c,"APS_REPORT_FIELDS",{}).get(k),flush=True)
          PY
