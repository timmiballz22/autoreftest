name: LN Church read-only discovery
on:
  push:
    branches: [lnchurch-worker-20261021]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exhaust legacy and v2 listing cursors without claiming
        shell: bash
        run: |
          python -m pip install -q -U ln-church-agent
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json, collections
          base="https://kari.mayim-mayim.com/api/agent/tasks"
          paths=[
            ("scheduled_v2",{"status":"OPEN","task_type":"scheduled_http_get_batch.v1","task_schema_version":"ln_church.agent_task.v2","limit":50}),
            ("payment_discovery_v1",{"status":"OPEN","task_type":"payment_surface_discovery.v1","limit":50})
          ]
          for name,p0 in paths:
            cursor=None;seen=set();page_count=0;total=0;eligible=[];types=collections.Counter()
            while page_count<150:
              p=dict(p0)
              if cursor:p["cursor"]=cursor
              u=base+"?"+urllib.parse.urlencode(p)
              try:
                with urllib.request.urlopen(u,timeout=20) as res: data=json.load(res)
              except urllib.error.HTTPError as e:
                print(name,"HTTP_ERROR",e.code,e.read(400).decode("utf8","replace"),flush=True);break
              except Exception as e:print(name,"ERROR",repr(e),flush=True);break
              tasks=data.get("tasks",[])
              page_count+=1;total+=len(tasks)
              for t in tasks:
                types[t.get("task_type")]+=1
                if t.get("claimable",False) and (t.get("capacity_remaining",0)>0):
                  eligible.append((t.get("task_id"),t.get("reward"),t.get("capacity_remaining")))
              cursor=data.get("next_cursor")
              print(name,"page",page_count,"items",len(tasks),"next",bool(cursor),"eligible_so_far",len(eligible),flush=True)
              if not cursor or cursor in seen:break
              seen.add(cursor)
            print("SUMMARY",name,"pages",page_count,"tasks",total,"types",dict(types),"eligible",str(eligible)[:8000],flush=True)
          PY
